# cargo-deny configuration for the `tracker` CLI.
#
# Run: `cargo deny check`
#
# Sections required by `iterative-adversarial-refinement/supplements/rust.md`
# Security/Platform: [advisories], [licenses], [bans], [sources].
#
# Closes Security Review 6 Finding 4 / Platform Engineer Review 8 Finding 2.

[graph]
# Single-target build; portfolio scope is `cargo build` on the host platform.
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RustSec database CVEs and unmaintained-crate advisories.
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses — explicit allowlist; deny by default.
# ---------------------------------------------------------------------------
# The current dependency tree resolves to a small set of permissive licenses
# (MIT, Apache-2.0, BSD-2/3-Clause, Unicode-3.0, ISC, MPL-2.0, Zlib).
# A new dependency with a license outside this list fails CI — the apprentice
# must explicitly add it (or replace the dependency) rather than silently
# accepting a copyleft or unknown license.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

# ---------------------------------------------------------------------------
# Bans — duplicate-version policy and explicit denylist.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — restrict where dependencies may be pulled from.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

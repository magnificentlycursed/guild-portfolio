[package]
name = "tracker"
version = "0.1.0"
edition = "2021"
description = "A personal command-line issue tracker. Single user, no network; issues stored in a local JSON file. Portfolio project."
readme = "README.md"
publish = false
# TODO(SO): set `license` (e.g. "MIT OR Apache-2.0") and `repository` URL before
# any external distribution. `publish = false` blocks accidental crates.io upload
# in the meantime. Raised by TW Review 6.

[[bin]]
name = "tracker"
path = "src/main.rs"

[lib]
name = "tracker"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

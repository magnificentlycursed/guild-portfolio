repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: no-home-dir-paths
        name: block local home directory paths
        language: script
        entry: issue-tracker-cli/.pre-commit-hooks/check-no-home-paths.sh
        pass_filenames: true
        types: [text]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: anonymization
        name: anonymization (IAR suite hook — repo-wide; consolidates `no-home-dir-paths` + `review-log-anonymization` at PR #43)
        language: script
        # Suite-level hook: lives at vsdd-suite/hooks/ so it carries with
        # the suite if the suite is forked into a separate repo. PR #43
        # consolidated two previously-separate hooks (`no-home-dir-paths`
        # at `issue-tracker-cli/.pre-commit-hooks/check-no-home-paths.sh`
        # + `review-log-anonymization` at this suite-level path) into a
        # single repo-wide check. The consolidated hook is a superset of
        # both — HOME path + git user.name + git user.email + public-URL
        # allowlist — applied to every committed text file. Per operator
        # directive at PR #43: "Both anonymization hooks should be repo
        # wide. Might make sense to combine them." Allows public-URL
        # contexts (github.com/, gitlab.com/, bitbucket.org/,
        # bsky.app/profile/, noreply.*). Registered as G-98 in
        # vsdd-suite/suite-development/FINDINGS-INDEX.md.
        entry: vsdd-suite/hooks/check-anonymization.sh
        pass_filenames: true
        types: [text]

      - id: check-crosslink-references
        name: check crosslink command/flag citations against installed CLI (IAR suite G-139 hook)
        language: script
        # Mechanizes the G-123 discipline (external-dependency feature
        # verification). Greps user-facing suite docs for `crosslink <subcmd> ...
        # --<flag>` patterns, runs `crosslink <subcmd> --help` for each, and
        # fails the commit if any cited flag is missing from the help output.
        # Skips gracefully when crosslink is not installed (CI-safe).
        # Registered as G-139 in vsdd-suite/suite-development/FINDINGS-INDEX.md
        # after two recurrences across four sessions of the same speculation-
        # then-late-correction failure mode.
        entry: vsdd-suite/hooks/check-crosslink-references.py
        pass_filenames: true
        # Scope to user-facing docs only. Historical-narrative files
        # (CHANGELOG, COMPATIBILITY, FINDINGS-INDEX, SUITE-DEVELOPMENT-REVIEW,
        # review-log/) intentionally preserve citations of past wrong commands
        # as audit trail; the hook self-skips them as a defense-in-depth
        # check, but the `exclude:` here filters at the staged-files level
        # for efficiency. Covers both the suite source (vsdd-suite/**) and
        # per-project per-domain index files (<project>/vsdd-suite/*.md —
        # single-level only, not review-log).
        files: ^(vsdd-suite/.*\.(md|sh)|.*/vsdd-suite/[^/]+\.md)$
        exclude: ^(vsdd-suite/(CHANGELOG|COMPATIBILITY)\.md|vsdd-suite/suite-development/SUITE-DEVELOPMENT-REVIEW\.md|.*/review-log/.*\.md|.*/FINDINGS-INDEX\.md)$

      - id: check-suite-review-preamble
        name: check suite-review and per-domain review-log preamble + finding-header discipline (VSDD suite Review 68 hook)
        language: script
        # Mechanizes the discipline corrections from Reviews 67 + 68. Per
        # `suite-development.md` § Per-review entry preamble (G-133) and §
        # Suite review entry format: every per-review entry requires
        # `**Scope:**`, `**Session note:**`, `**Source:**` preamble fields
        # (suite-review entries additionally require `**Lens:**`); finding
        # headers use only `**Finding N — Title**` or `**G-XX — Title**`
        # forms (Review 67 Findings 1 + 2 corrections); each finding ends
        # with `**Resolution:**` or `**Classification:**`; `**Source:**`
        # value is one of `domain-raised` / `director-raised` /
        # `regression-replay` / `external-feedback` / `mixed`.
        # Forward-only per G-89: entries dated before 2026-05-20 are
        # exempt. Per-entry `<!-- hook-bypass: <rationale> -->` HTML
        # comment in the first 5 lines bypasses for that entry only;
        # bypasses are themselves findings for the next registry-walk
        # review.
        entry: vsdd-suite/hooks/check-suite-review-preamble.py
        pass_filenames: true
        # Scope to suite-review-log AND per-project review-log markdown.
        files: ^(vsdd-suite/suite-development/review-log/.*\.md|.*/vsdd-suite/review-log/.*\.md)$
        # external-review-log/ has its own shape contract (Reviewer + Source +
        # Verbatim source content sections; reviewer-named files; identity-
        # correlation discipline) per Review 88 — handled by the
        # check-external-review-anonymization hook below, NOT by this hook's
        # suite-review-preamble pattern.
        exclude: ^vsdd-suite/suite-development/review-log/external-review-log/

      - id: check-suite-internal-terminology
        name: check suite-internal-terminology containment in user-facing project artifacts (VSDD suite Review 88 hook)
        language: python
        # Per `suite-development.md` § External-review-log subfolder pattern
        # (companion hook) — codified at Review 88 (PR #42) after
        # @shimmermathlabs.com's external-feedback Post 10 surfaced
        # "Sycophancy-compensation reminder" leaking into user-facing
        # manual-test prose. Scans user-facing project artifacts
        # (manual-tests/*.md; README.md; TODO.md; DESIGN.md;
        # INSTALL-VERIFICATION.md) for suite-internal AI-agent-discipline
        # vocabulary:
        # - "Sycophancy-compensation reminder"
        # - Bare `<Domain> Dim N` references (TW Dim 12; QE Dim 2; etc.)
        # - Bare `G-NNN` registry IDs without markdown link
        # - "adversarial-cold-session" / "cluster-batching" / "cold-session-discipline"
        # Quoted blocks (> prefix) + fenced code blocks are skipped per
        # source-archiving discipline. `<!-- hook-bypass: <rationale> -->`
        # in the first 5 lines bypasses for that file only.
        entry: vsdd-suite/hooks/check-suite-internal-terminology.py
        pass_filenames: true
        files: ^([^/]+/manual-tests/.*\.md|[^/]+/README\.md|[^/]+/TODO\.md|[^/]+/DESIGN\.md|[^/]+/INSTALL-VERIFICATION\.md|.*/manual-tests/[^/]+\.md|.*/(README|TODO|DESIGN|INSTALL-VERIFICATION)\.md)$
        exclude: ^(vsdd-suite/|.*/vsdd-suite/|.*/PROCESS\.md|.*/CHANGELOG\.md|.*/COMPATIBILITY\.md)
        require_serial: false

      - id: check-external-review-anonymization
        name: check external-review-log identity-correlation discipline (VSDD suite Review 88 hook)
        language: python
        # Per `suite-development.md` § External-review-log subfolder pattern §
        # Identity-correlation discipline (Review 88, PR #42):
        # - Multi-platform handle declarations must share a normalized slug
        #   (e.g., dollspace-gay/dollspace.gay OK; nwhitehead/shimmermathlabs FAIL)
        # - `**Name:**` fields must match a declared handle slug (real names
        #   that differ from any handle are correlation-surfacing — FAIL)
        # - Bare email addresses in Reviewer/Source preamble are FAIL (emails
        #   in quoted source-content blocks are preserved per source-archiving)
        # - H1 + required H2 sections (Reviewer + Source) enforce shape contract
        # Operator-context: the suite (and many reviewers) are marginalized
        # people; surfacing real names + handles in correlated form has
        # historically been a vector for harm. Knowability ≠ surfacing.
        entry: vsdd-suite/hooks/check-external-review-anonymization.py
        pass_filenames: true
        files: ^vsdd-suite/suite-development/review-log/external-review-log/.*\.md$
        require_serial: false

      - id: check-project-review-discipline
        name: check project-level domain-review entry-structure discipline (VSDD suite Review 74 hook)
        language: script
        # Parallel to check-suite-review-preamble.py but focused on
        # project-level review-log discipline: every Review entry must
        # contain a `### Summary` section, a `**Coordination:**` line
        # (with `*(none)*` placeholder allowed), classification-section
        # headings matching the domain's classification universe per
        # `suite-development.md` § Finding classification schemas by
        # domain type, and finding headers with a trailing discipline-
        # reference parenthetical (`(Dim X)`, `(Phase 5 Surface B)`,
        # `(Rust supplement — path traversal)`) for non-Hallucinated
        # findings. Forward-only per G-89: entries dated before
        # 2026-05-20 are exempt. Per-entry `<!-- hook-bypass: <rationale>
        # -->` HTML comment in the first 5 lines bypasses for that
        # entry only.
        entry: vsdd-suite/hooks/check-project-review-discipline.py
        pass_filenames: true
        # Scope to per-project review-log markdown ONLY (suite-review
        # files at vsdd-suite/suite-development/review-log/ are
        # validated by the preceding hook).
        files: ^.*/vsdd-suite/review-log/.*\.md$

      - id: check-changelog-currency
        name: check CHANGELOG.md updated when source changes (IAR suite G-129 hook)
        language: script
        # Mechanizes the G-129 discipline (documentation currency at commit
        # time). When a project tree contains both CHANGELOG.md and a
        # `.changelog-required` marker file (opt-in flag), source changes in
        # that tree must include a CHANGELOG.md update in the same commit.
        # Projects without the marker are not enforced — the hook is
        # methodology-neutral about CHANGELOG discipline absent explicit
        # opt-in. Registered as G-129 in vsdd-suite/suite-development/
        # FINDINGS-INDEX.md after six consecutive ITC layer closes where
        # TW caught CHANGELOG staleness post-hoc.
        entry: vsdd-suite/hooks/check-changelog-currency.py
        pass_filenames: true
        # Covers all text files — the hook's per-file extension filter
        # (`.rs`, `.ts`, `.tsx`, `.js`, `.jsx`, `.py`, `.go`, `.md`, `.sh`,
        # `.yaml`, `.yml`, `.toml`) is the actual scoping mechanism. Excludes
        # nothing here — opt-in is per-project via the `.changelog-required`
        # marker file, not via this config's `exclude:` pattern.
        types: [text]

      - id: cargo-fmt-check
        name: cargo fmt (per Rust-project subdirectory)
        language: system
        # `git rev-parse --show-toplevel` resolves to the repo root regardless
        # of where pre-commit was invoked from; fixes Platform Engineer
        # Review 8 Finding 8 (the prior `cd issue-tracker-cli` was relative
        # and broke if pre-commit ran from a subdir).
        #
        # Scope extended per Platform Engineer Review 1 Finding 7 (bookmark-
        # cli-manual) — covers both Rust-project subdirectories. The hook
        # derives each project root from the staged `.rs` file paths
        # (`pass_filenames: true`) and runs `cargo fmt --check` once per
        # project whose files changed; per-project scoping avoids running
        # the gate on projects untouched by the commit. POSIX-compatible
        # (no `declare -A`) so it runs on macOS's bundled bash 3.2.
        entry: bash -c 'set -eu; root="$(git rev-parse --show-toplevel)"; projects=""; for f in "$@"; do case "$f" in issue-tracker-cli/*) p="issue-tracker-cli" ;; vsdd-suite-reference-examples/bookmark-cli-manual/*) p="vsdd-suite-reference-examples/bookmark-cli-manual" ;; *) continue ;; esac; case " $projects " in *" $p "*) ;; *) projects="$projects $p" ;; esac; done; for p in $projects; do (cd "$root/$p" && cargo fmt --check); done' --
        pass_filenames: true
        files: ^(issue-tracker-cli|vsdd-suite-reference-examples/bookmark-cli-manual)/.*\.rs$

      - id: cargo-clippy-check
        name: cargo clippy (per Rust-project subdirectory)
        language: system
        # Platform Engineer Review 12 Finding 3 closure: left-shift the
        # clippy gate from CI to pre-commit so a clippy regression in
        # `*.rs` files is caught locally before the commit lands. Same
        # `cd "$(git rev-parse --show-toplevel)"` pattern as cargo-fmt-check
        # for sub-directory invocation safety. SE Review 18 concurrence
        # recorded — SE owns src/**/*.rs and confirms blocking commits
        # on clippy warnings is the right developer-ergonomic posture.
        #
        # Scope extended per Platform Engineer Review 1 Finding 7 (bookmark-
        # cli-manual) — same per-project detection shape as cargo-fmt-check
        # above. POSIX-compatible so it runs on macOS's bundled bash 3.2.
        entry: bash -c 'set -eu; root="$(git rev-parse --show-toplevel)"; projects=""; for f in "$@"; do case "$f" in issue-tracker-cli/*) p="issue-tracker-cli" ;; vsdd-suite-reference-examples/bookmark-cli-manual/*) p="vsdd-suite-reference-examples/bookmark-cli-manual" ;; *) continue ;; esac; case " $projects " in *" $p "*) ;; *) projects="$projects $p" ;; esac; done; for p in $projects; do (cd "$root/$p" && cargo clippy --all-targets --locked -- -D warnings); done' --
        pass_filenames: true
        files: ^(issue-tracker-cli|vsdd-suite-reference-examples/bookmark-cli-manual)/.*\.rs$

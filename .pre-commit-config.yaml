repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: no-home-dir-paths
        name: block local home directory paths
        language: script
        entry: issue-tracker-cli/.pre-commit-hooks/check-no-home-paths.sh
        pass_filenames: true
        types: [text]

      - id: review-log-anonymization
        name: review-log anonymization (IAR suite hook)
        language: script
        # Suite-level hook: lives at vsdd-suite/hooks/
        # so it carries with the suite if the suite is forked into a separate
        # repo. Scoped to IAR review-log markdown only — the source-code
        # no-home-dir-paths hook above covers everything else. Allows public
        # URL contexts (github.com/, gitlab.com/, bitbucket.org/, noreply.*).
        # Registered as G-98 in vsdd-suite/suite-development/GAP-ANALYSIS-LOG.md.
        entry: vsdd-suite/hooks/check-review-log-anonymization.sh
        pass_filenames: true
        # Covers: suite-internal markdown (vsdd-suite/**), future-project IAR
        # markdown (<project>/vsdd-suite/**), and completed-project IAR
        # markdown still using the legacy directory name (<project>/iterative-
        # adversarial-refinement/**) per the G-88 forward-only constraint.
        files: ^(vsdd-suite/.*\.md|.*/iterative-adversarial-refinement/.*\.md|.*/vsdd-suite/.*\.md)$

      - id: check-crosslink-references
        name: check crosslink command/flag citations against installed CLI (IAR suite G-139 hook)
        language: script
        # Mechanizes the G-123 discipline (external-dependency feature
        # verification). Greps user-facing suite docs for `crosslink <subcmd> ...
        # --<flag>` patterns, runs `crosslink <subcmd> --help` for each, and
        # fails the commit if any cited flag is missing from the help output.
        # Skips gracefully when crosslink is not installed (CI-safe).
        # Registered as G-139 in vsdd-suite/suite-development/GAP-ANALYSIS-LOG.md
        # after two recurrences across four sessions of the same speculation-
        # then-late-correction failure mode.
        entry: vsdd-suite/hooks/check-crosslink-references.sh
        pass_filenames: true
        # Scope to user-facing docs only. Historical-narrative files
        # (CHANGELOG, COMPATIBILITY, GAP-ANALYSIS-LOG, SUITE-REVIEW-INDEX,
        # review-log/, FINDINGS-INDEX) intentionally preserve citations of
        # past wrong commands as audit trail; the hook self-skips them as a
        # defense-in-depth check, but the `exclude:` here filters at the
        # staged-files level for efficiency. Covers both the suite source
        # (vsdd-suite/**) and per-project per-domain index files
        # (<project>/vsdd-suite/*.md — single-level only, not review-log).
        files: ^(vsdd-suite/.*\.(md|sh)|.*/vsdd-suite/[^/]+\.md)$
        exclude: ^(vsdd-suite/(CHANGELOG|COMPATIBILITY)\.md|vsdd-suite/suite-development/(GAP-ANALYSIS-LOG|SUITE-REVIEW-INDEX)\.md|.*/review-log/.*\.md|.*/FINDINGS-INDEX\.md)$

      - id: cargo-fmt-check
        name: cargo fmt (issue-tracker-cli)
        language: system
        # `git rev-parse --show-toplevel` resolves to the repo root regardless
        # of where pre-commit was invoked from; fixes Platform Engineer
        # Review 8 Finding 8 (the prior `cd issue-tracker-cli` was relative
        # and broke if pre-commit ran from a subdir).
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/issue-tracker-cli" && cargo fmt --check'
        pass_filenames: false
        files: ^issue-tracker-cli/.*\.rs$

      - id: cargo-clippy-check
        name: cargo clippy (issue-tracker-cli)
        language: system
        # Platform Engineer Review 12 Finding 3 closure: left-shift the
        # clippy gate from CI to pre-commit so a clippy regression in
        # `*.rs` files is caught locally before the commit lands. Same
        # `cd "$(git rev-parse --show-toplevel)"` pattern as cargo-fmt-check
        # for sub-directory invocation safety. SE Review 18 concurrence
        # recorded — SE owns src/**/*.rs and confirms blocking commits
        # on clippy warnings is the right developer-ergonomic posture.
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/issue-tracker-cli" && cargo clippy --all-targets --locked -- -D warnings'
        pass_filenames: false
        files: ^issue-tracker-cli/.*\.rs$

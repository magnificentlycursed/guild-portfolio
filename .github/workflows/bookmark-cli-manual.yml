name: CI — bookmark-cli-manual

# Closes Platform Engineer Review 1 Finding 1:
# https://github.com/magnificentlycursed/guild-portfolio/blob/main/vsdd-suite-reference-examples/bookmark-cli-manual/vsdd-suite/review-log/2026-05-20-platform-engineer.md
# Modeled on the sibling `issue-tracker-cli.yml` but split into separate jobs
# (fmt / clippy / test / deny / audit) so a single failure isolates to one
# job rather than collapsing the whole pipeline.

on:
  push:
    branches: ['**']
    paths:
      - 'vsdd-suite-reference-examples/bookmark-cli-manual/**'
      - '.github/workflows/bookmark-cli-manual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vsdd-suite-reference-examples/bookmark-cli-manual/**'
      - '.github/workflows/bookmark-cli-manual.yml'

# Per the VSDD suite's `supplements/github-actions.md` § Security § `permissions:` block:
# read-only access is sufficient for build + test + lint workflows. Declaring explicitly
# prevents the workflow from inheriting org-default-permissive scope.
permissions:
  contents: read

# Per `supplements/github-actions.md` § Platform Engineering § Concurrency control:
# cancel obsolete runs from supersession pushes to save runner minutes + reduce
# status-check noise. Per-ref grouping (not per-PR) so direct pushes also cancel.
concurrency:
  group: 'bookmark-cli-manual-${{ github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    working-directory: vsdd-suite-reference-examples/bookmark-cli-manual

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    # Per `supplements/github-actions.md` § Platform Engineering § Workflow time budget:
    # ~5 min observed median; 10 min cap catches hangs without over-allowing.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master at 2026-05-04
        with:
          # Explicit toolchain pin matching `rust-toolchain.toml`. The action
          # only auto-discovers `rust-toolchain.toml` at repo root; this
          # project lives in a subdirectory so the file isn't visible to the
          # action's discovery path. Mirror the pin explicitly per the sibling
          # `issue-tracker-cli.yml` pattern.
          toolchain: 1.95
          components: rustfmt

      - name: Format check
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    # Per `supplements/github-actions.md` § Platform Engineering § Workflow time budget:
    # ~5 min observed median; 10 min cap catches hangs without over-allowing.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master at 2026-05-04
        with:
          toolchain: 1.95
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: vsdd-suite-reference-examples/bookmark-cli-manual

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    # Per `supplements/github-actions.md` § Platform Engineering § Workflow time budget:
    # ~5 min observed median; 10 min cap catches hangs without over-allowing.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master at 2026-05-04
        with:
          toolchain: 1.95

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: vsdd-suite-reference-examples/bookmark-cli-manual

      # `--locked` (per Platform Engineer Review 1 Finding 8): require
      # Cargo.lock to match Cargo.toml's resolved versions so CI exercises
      # the same dependency graph the developer shipped.
      - name: Test
        run: cargo test --locked

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    # Per `supplements/github-actions.md` § Platform Engineering § Workflow time budget:
    # ~5 min observed median; 10 min cap catches hangs without over-allowing.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master at 2026-05-04
        with:
          toolchain: 1.95

      # Closes Platform Engineer Review 1 Finding 4 (deny.toml) — gates on
      # CVEs, license violations, banned/duplicate crates, and disallowed
      # sources simultaneously. Tool version pinned per the supply-chain
      # discipline established at PE R8 Finding 6 on the sibling project.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.4

      - name: cargo deny check
        run: cargo deny --locked check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Per `supplements/github-actions.md` § Platform Engineering § Workflow time budget:
    # ~5 min observed median; 10 min cap catches hangs without over-allowing.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master at 2026-05-04
        with:
          toolchain: 1.95

      # Closes Platform Engineer Review 1 Finding 5 — fast advisory-only
      # CVE check against Cargo.lock. Runs parallel to `cargo deny check`
      # per the Rust supplement § PE (both controls are prescribed); kept
      # as a separate job so an advisory-only failure does not mask a
      # license/bans/sources failure from `cargo deny`.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Dependency audit
        run: cargo audit

  scaling:
    name: cargo test -- --ignored (scaling)
    # Layer 2 data-scaling sentinel coverage per DESIGN.md § Performance
    # budget "Data-scaling tests" + TODO.md § Layer 2 Layer-gate criterion #1
    # (`cargo test -- --ignored (scaling)`). Closes Layer 2 Round 1 QE F1 +
    # PE F2 + SO F1 — the spec/decomposition/manual-test plan all named
    # `tests/scaling.rs` as shipped + named this CI job as the runner.
    #
    # Gated to Linux x86_64 only to keep macOS-runner cost down at the
    # 10,000-bookmark cliff (~1-2 min wall-clock per the test's `#[ignore]`
    # annotation). The Linux x86_64 runner is the standard portfolio CI
    # runner so this matches the existing job convention.
    #
    # `needs: test` so the standard `cargo test` job acts as a gate — the
    # ignored scaling sentinels run only after the default-test suite passes.
    runs-on: ubuntu-latest
    needs: test
    # 10,000-bookmark sentinel takes ~1-2 min on commodity hardware; 20 min
    # cap allows for slower-than-usual GitHub runners + the per-add atomic-
    # save + fsync overhead without over-allowing.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master at 2026-05-04
        with:
          toolchain: 1.95

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: vsdd-suite-reference-examples/bookmark-cli-manual

      # `--release` so the 10,000-bookmark sentinel completes within the
      # job timeout — debug-profile per-add overhead is ~3-5x the release
      # profile, which would push the 10k cliff over the 20-min budget.
      # Per-test `#[ignore]` flag is respected by `cargo test`; the
      # `-- --ignored` flag runs only the ignored sentinels.
      - name: Scaling sentinels
        run: cargo test --release --test scaling --locked -- --ignored

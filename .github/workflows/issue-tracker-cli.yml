name: CI — issue-tracker-cli

on:
  push:
    branches: ['**']
    paths:
      - 'issue-tracker-cli/**'
      - '.github/workflows/issue-tracker-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'issue-tracker-cli/**'
      - '.github/workflows/issue-tracker-cli.yml'

defaults:
  run:
    working-directory: issue-tracker-cli

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: issue-tracker-cli

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Dependency audit
        run: cargo audit
